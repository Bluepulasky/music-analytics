name: navidrome-dashboard

services:
  app:
    build: .
    ports:
      - "8087:8087"
    volumes:
      - ./site:/app/site:ro
      - ./data:/app/data
      - ./config.local.yaml:/app/config.local.yaml:ro
      - /mnt/tank-hdd/media/Music:/mnt/tank-hdd/media/Music:rw
      - ./generos.yaml:/app/generos.yaml:ro
    restart: unless-stopped