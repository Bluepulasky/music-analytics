# generos.yaml
# Fuente única de géneros: la leen el editor de tags (Flask) y el generador del dashboard.
#
# tier1: géneros amplios. El ORDEN es la prioridad: si una canción tiene varios,
#        el primero de esta lista es su "género principal" (el que usa la torta).
# tier2: para cada tier 1, sus subgéneros (igual que en Bandcamp). Un mismo subgénero
#        puede aparecer bajo varios tier 1.
# alias: otras formas de escribir lo mismo -> nombre canónico (de tier1 o tier2).
#
# En los archivos se guarda así: "rock; progressive rock" (tier 1; tier 2).
# Si una canción solo trae un tier 2, el tier 1 se deduce: de forma directa si el
# subgénero tiene un solo padre; si tiene varios, solo cuando no hay ningún tier 1 claro.
# Mayúsculas, guiones y barras no importan al comparar ("Prog-Rock" == "prog rock").
#
# Después de editar: reiniciar el editor y volver a generar el dashboard.

tier1:
  - rock
  - metal
  - punk
  - alternative
  - jazz
  - blues
  - folk
  - country
  - funk
  - soul
  - reggae
  - hip-hop
  - rap
  - electronic
  - ambient
  - experimental
  - world
  - classical
  - soundtrack
  - acoustic
  - devotional
  - kids
